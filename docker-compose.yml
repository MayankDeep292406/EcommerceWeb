version: "3.9"

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:5000

    container_name: shop_Now_frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shop_Now_backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/shop_Now
      JWT_SECRET: mysecretkey

    depends_on:
      - mongodb

    restart: unless-stopped

  mongodb:
    image: mongo:7

    container_name: shop_Now_mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

volumes:
  mongo_data: